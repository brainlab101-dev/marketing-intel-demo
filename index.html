<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sage canvas → one rounded app frame → sidebar + scrolling main column of white cards. */
:root {
  --canvas: #e3eadf; --frame: #f4f6f1; --card: #ffffff; --sunk: #eef2eb;
  --ink: #17231e; --ink-2: #4c5852; --muted: #7f8a84; --line: #e1e6de; --line-2: #cbd4c8;
  --lime: #d5ef9c; --lime-ink: #2c4710; --teal: #1d4b43; --teal-ink: #ffffff; --teal-soft: #dcebe6;
  --coral: #f2785a; --coral-soft: #fde3da; --coral-ink: #8a2f17;
  --good: #1c7a35; --good-bg: #e1f3e1; --bad: #b93a30; --bad-bg: #fbe4e1; --warn: #8a5a00; --warn-bg: #fcefcf;
  --kol: #c94f86; --kol-bg: #f8d6ec; --kol-ink: #6a1f52;
  --promo: #c98c00; --promo-bg: #fbe7a2; --promo-ink: #5f4500;
  --ads: #2a78d6; --ads-bg: #d7e6fb; --ads-ink: #1a4a85;
  --offline: #1baf7a; --offline-bg: #cfeedf; --offline-ink: #145a3d;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --grid: #e7ebe4; --axis: #c3c9c0;
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 18px; --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0d1311; --frame: #131a17; --card: #19221f; --sunk: #141c19;
  --ink: #edf2ec; --ink-2: #b7c1ba; --muted: #86918b; --line: #25302b; --line-2: #34403a;
  --lime: #3a5a1c; --lime-ink: #e3f7bd; --teal: #9ad9c8; --teal-ink: #0d1d19; --teal-soft: #1d3530;
  --coral: #f28a6e; --coral-soft: #47271f; --coral-ink: #ffd5c8;
  --good: #5ccb78; --good-bg: #173322; --bad: #f08479; --bad-bg: #3c1e1b; --warn: #e8b64a; --warn-bg: #3a2e12;
  --kol: #e07aa8; --kol-bg: #4a2341; --kol-ink: #f8d3ec;
  --promo: #e2ac2f; --promo-bg: #45380f; --promo-ink: #f8e39a;
  --ads: #3987e5; --ads-bg: #1c3555; --ads-ink: #cfe2fb;
  --offline: #199e70; --offline-bg: #163d2e; --offline-ink: #c4f0db;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --grid: #24302b; --axis: #3a4741; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #0d1311; --frame: #131a17; --card: #19221f; --sunk: #141c19;
  --ink: #edf2ec; --ink-2: #b7c1ba; --muted: #86918b; --line: #25302b; --line-2: #34403a;
  --lime: #3a5a1c; --lime-ink: #e3f7bd; --teal: #9ad9c8; --teal-ink: #0d1d19; --teal-soft: #1d3530;
  --coral: #f28a6e; --coral-soft: #47271f; --coral-ink: #ffd5c8;
  --good: #5ccb78; --good-bg: #173322; --bad: #f08479; --bad-bg: #3c1e1b; --warn: #e8b64a; --warn-bg: #3a2e12;
  --kol: #e07aa8; --kol-bg: #4a2341; --kol-ink: #f8d3ec;
  --promo: #e2ac2f; --promo-bg: #45380f; --promo-ink: #f8e39a;
  --ads: #3987e5; --ads-bg: #1c3555; --ads-ink: #cfe2fb;
  --offline: #199e70; --offline-bg: #163d2e; --offline-ink: #c4f0db;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --grid: #24302b; --axis: #3a4741; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.num, td, .kpi-v { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 600; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
a { color: inherit; }

.frame { max-width: 1440px; margin: 0 auto; background: var(--frame); border: 1px solid var(--line); border-radius: 26px; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 32px); overflow: clip; }
.side { border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; align-self: start; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.logo { font-weight: 700; font-size: 20px; letter-spacing: -0.03em; color: var(--teal); padding: 2px 8px; display: flex; align-items: center; gap: 8px; }
.logo svg { width: 22px; height: 22px; }
.ws-btn { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; text-align: left; }
.ws-ico { width: 32px; height: 32px; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; flex: none; font-weight: 700; font-size: 13px; color: var(--teal); }
.ws-name { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.ws-kind { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ws-menu { position: relative; }
.ws-pop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 6px; z-index: 30; box-shadow: 0 12px 30px -12px rgba(20, 40, 30, .25); }
.ws-pop button { width: 100%; display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 8px; border-radius: 10px; text-align: left; }
.ws-pop button:hover, .ws-pop button[aria-current="true"] { background: var(--sunk); }
.ws-pop .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; }
nav.main-nav { display: flex; flex-direction: column; gap: 4px; }
nav.main-nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
nav.main-nav a:hover { background: var(--sunk); color: var(--ink); }
nav.main-nav a[aria-current="page"] { background: var(--lime); color: var(--lime-ink); font-weight: 600; }
nav.main-nav svg { width: 18px; height: 18px; flex: none; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; gap: 10px; align-items: center; padding-inline: 6px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.foot-name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.foot-sub { font-size: 12px; color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px; }
.menu-btn svg { width: 18px; height: 18px; display: block; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 8px 34px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.search-pop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; z-index: 30; max-height: 320px; overflow: auto; box-shadow: 0 12px 30px -12px rgba(20, 40, 30, .25); }
.search-pop button { display: flex; width: 100%; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; }
.search-pop button:hover, .search-pop button:focus-visible { background: var(--sunk); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.asof { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.lang-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 10px; font-weight: 600; font-size: 12.5px; }

.view { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.head .sub { color: var(--ink-2); margin-top: 4px; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 11px; padding: 8px 14px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); border-radius: 12px; padding: 10px 16px; }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--teal); }
.btn svg { width: 16px; height: 16px; }
.link { border: 0; background: none; padding: 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.grid { display: grid; gap: 18px; }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-1-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-h .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chart { position: relative; width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw-line { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.sw-dash { width: 16px; height: 0; border-top: 2px dashed; display: inline-block; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.headline { background: var(--lime); color: var(--lime-ink); border: 0; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.headline .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; opacity: .8; }
.headline .big { font-size: 19px; font-weight: 600; line-height: 1.4; margin-top: 4px; max-width: 70ch; text-wrap: pretty; }
.headline .small { margin-top: 6px; font-size: 13px; }
.headline .btn { margin-left: auto; background: var(--card); color: var(--ink); border-color: transparent; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 4px 20px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi-l { color: var(--ink-2); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.kpi-v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kpi-n { font-size: 12px; color: var(--muted); margin-top: 2px; }
.delta { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 7px; display: inline-flex; gap: 3px; align-items: center; letter-spacing: 0; }
.delta.up { background: var(--good-bg); color: var(--good); }
.delta.down { background: var(--bad-bg); color: var(--bad); }
.delta.flat { background: var(--sunk); color: var(--ink-2); }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.c-high { background: var(--good-bg); color: var(--good); }
.c-medium { background: var(--warn-bg); color: var(--warn); }
.c-low { background: var(--sunk); color: var(--muted); }
.b-shared { background: var(--ads-bg); color: var(--ads-ink); }
.b-wasted { background: var(--bad-bg); color: var(--bad); }
.b-live { background: var(--coral-soft); color: var(--coral-ink); }
.b-planned { background: var(--sunk); color: var(--ink-2); }
.b-done { background: var(--teal-soft); color: var(--teal); }
.b-noDot::before { display: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
.t-kol { background: var(--kol-bg); color: var(--kol-ink); }
.t-promo { background: var(--promo-bg); color: var(--promo-ink); }
.t-ads { background: var(--ads-bg); color: var(--ads-ink); }
.t-offline { background: var(--offline-bg); color: var(--offline-ink); }
.plat { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--ink-2); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: center; }
.bar-row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .name small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.bar-track { height: 10px; background: var(--sunk); border-radius: 6px; position: relative; overflow: hidden; }
.bar-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 0 6px 6px 0; background: var(--line-2); }
.bar-fill.hi { background: var(--coral); }
.bar-fill.pos { background: var(--teal); }
.bar-fill.neg { background: var(--bad); }
.bar-fill.muted { background: var(--axis); }
.bar-val { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }
.bar-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); opacity: .5; }
button.bar-row { border: 0; background: none; text-align: left; padding: 4px; margin: -4px; border-radius: 8px; }
button.bar-row:hover { background: var(--sunk); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 12px; }
.week .d { font-size: 11.5px; color: var(--muted); }
.week .n { font-weight: 600; width: 32px; height: 32px; display: grid; place-items: center; margin: 4px auto 0; border-radius: 50%; }
.week .n.today { background: var(--kol-bg); color: var(--kol-ink); }
.week .n.has { box-shadow: inset 0 0 0 1.5px var(--line-2); }
.ev-list { display: flex; flex-direction: column; gap: 8px; }
.ev-sep { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.ev-sep::after { content: ""; flex: 1; border-top: 1px dashed var(--line-2); }
.ev-item { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 10px 12px; border: 0; text-align: left; width: 100%; }
.ev-item .ico { width: 30px; height: 30px; border-radius: 9px; background: var(--card); display: grid; place-items: center; flex: none; }
.ev-item .ico svg { width: 16px; height: 16px; }
.ev-item .tt { font-weight: 600; font-size: 13px; line-height: 1.25; }
.ev-item .meta { font-size: 11.5px; opacity: .85; }
.ev-item .when { margin-left: auto; font-size: 12px; font-weight: 600; white-space: nowrap; }

.hero-n { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }

.table-wrap { overflow-x: auto; margin-inline: -20px; padding-inline: 20px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
.tbl th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
.tbl th[aria-sort] button { color: var(--ink); }
.tbl td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--sunk); }
.tbl td.left, .tbl th.left { text-align: left; }
.tbl .sub-row td { background: var(--sunk); white-space: normal; }
.tbl .dim { color: var(--muted); }
.who { display: flex; flex-direction: column; gap: 3px; }
.who b { font-weight: 600; }
.who .tags { display: flex; gap: 5px; align-items: center; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--sunk); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--ink-2); }
.stat .v { font-size: 21px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 11.5px; color: var(--muted); }
.stat.hi { background: var(--coral-soft); }
.stat.hi .l, .stat.hi .n { color: var(--coral-ink); }

.note { display: flex; gap: 10px; align-items: flex-start; background: var(--ads-bg); color: var(--ads-ink); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.note.warn { background: var(--bad-bg); color: var(--bad); }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.ev-header { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.ev-header .title { font-size: 22px; font-weight: 600; }
.ev-header .meta { color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ev-nav { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; min-width: 0; flex: 1 1 320px; justify-content: flex-end; }
.ev-nav select { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 10px; min-width: 0; flex: 0 1 400px; }
.ev-nav .icon-btn { flex: none; }
.icon-btn:disabled { opacity: .4; cursor: default; }
details.calc { background: var(--sunk); border-radius: 12px; padding: 10px 14px; }
details.calc summary { cursor: pointer; font-weight: 600; }
details.calc ol { margin: 10px 0 2px; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .dh { font-size: 11.5px; color: var(--muted); padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-weight: 600; }
.cal .c { min-height: 92px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal .c.out { background: var(--sunk); }
.cal .c .dn { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.cal .c.today .dn { background: var(--kol-bg); color: var(--kol-ink); border-radius: 99px; padding: 0 7px; align-self: flex-start; }
.cal .chip { font-size: 11px; padding: 2px 6px; border: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; display: block; text-align: left; }
.cal .chip.ok { box-shadow: inset 3px 0 0 var(--good); border-radius: 0 6px 6px 0; }
.cal .chip.poor { box-shadow: inset 3px 0 0 var(--bad); border-radius: 0 6px 6px 0; }
.cal .chip.neutral { box-shadow: inset 3px 0 0 var(--muted); border-radius: 0 6px 6px 0; }
.cal-head { display: flex; align-items: center; gap: 8px; }
